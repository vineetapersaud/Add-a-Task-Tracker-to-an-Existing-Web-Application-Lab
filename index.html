
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website - Task Tracker</title>
</head>
<body>

    <h1>My Website</h1>
    <p>Welcome to my website!</p>

    <section id="task-tracker">
        <h2>My Task Tracker</h2>
        <p>Use this section to add and manage your tasks.</p>

        <form id="task-form">
            <label for="task-input">Enter a new task:</label>
            <input
                type="text"
                id="task-input"
                placeholder="Enter your task"
                required
            >
            <button type="submit">Add Task</button>
        </form>

        <h3>My Tasks</h3>
        <ul id="task-list"></ul>

        <p id="message"></p>
    </section>

</body>
</html>
